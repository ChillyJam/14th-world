<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>14th World</title>
<style>
  html, body { margin: 0; height: 100%; background: #0a0e23; overflow: hidden;
    font: 13px system-ui, sans-serif; color: #fff; }
  canvas { display: block; width: 100%; height: 100%; }
  #hud, #status { position: fixed; left: 12px; font-size: 14px; pointer-events: none;
    text-shadow: 1px 1px 0 rgba(0,0,0,.55); }
  #hud { top: 8px; }
  #status { bottom: 10px; }
  #help { position: fixed; right: 12px; bottom: 10px; font-size: 12px; opacity: .6;
    pointer-events: none; text-shadow: 1px 1px 0 rgba(0,0,0,.55); }
  #panel { position: fixed; top: 36px; right: 12px; min-width: 220px; max-width: 320px;
    padding: 10px 12px; background: rgba(24,26,36,.92); border: 1px solid #444;
    border-radius: 6px; box-shadow: 0 2px 8px rgba(0,0,0,.5); }
  #panel[hidden] { display: none; }
  #panel header { display: flex; justify-content: space-between; align-items: center;
    font-weight: 600; font-size: 14px; margin-bottom: 6px; }
  #panel button { background: none; border: 0; color: #aaa; font-size: 16px; cursor: pointer; }
  #panel table { border-collapse: collapse; width: 100%; }
  #panel td { padding: 2px 0; vertical-align: middle; }
  #panel td:first-child { color: #9a9ca8; padding-right: 12px; white-space: nowrap; }
  #panel h4 { margin: 10px 0 4px; padding-top: 8px; border-top: 1px solid #444; font-size: 13px; }
  #log { position: fixed; left: 12px; bottom: 34px; width: 320px; max-height: 40%;
    display: flex; flex-direction: column; background: rgba(24,26,36,.92);
    border: 1px solid #444; border-radius: 6px; box-shadow: 0 2px 8px rgba(0,0,0,.5); }
  #log[hidden] { display: none; }
  #log header { padding: 8px 12px 4px; font-weight: 600; font-size: 14px; }
  .entries { margin: 0; padding: 0 12px 8px; list-style: none; overflow-y: auto; }
  .entries li { padding: 2px 0; }
  .entries time { display: block; font-size: 11px; color: #9a9ca8; }
  .entries:empty::after { content: "Nothing yet"; color: #9a9ca8; }
  #panel .entries { max-height: 160px; padding: 0; }
  .bar { display: inline-block; width: 80px; height: 10px; background: #3a3d4c;
    border-radius: 3px; overflow: hidden; vertical-align: middle; }
  .bar i { display: block; height: 100%; background: #e5a64a; }
  .bar.bond i { background: #ff78a0; }
</style>
</head>
<body>
<canvas id="world"></canvas>
<div id="hud"></div>
<div id="status">Connecting…</div>
<div id="help">Drag or WASD to move · scroll or +/− to zoom · 0 to see everything · F to follow selection · L for the event log</div>
<aside id="log" hidden>
  <header>World events</header>
  <ul class="entries" id="world-log"></ul>
</aside>
<aside id="panel" hidden>
  <header><span id="title"></span><button id="close" aria-label="Close">×</button></header>
  <div id="stats"></div>
</aside>
<script>
"use strict";

const PROTOCOL_VERSION = 8;
const LOG_LIMIT = 2000;
const NIGHT_SKY = [10, 14, 35];
const DAY_GRASS = [104, 158, 86];
const PERSON = "#ffd166";
/** How close, in CSS pixels, a click has to land to pick something. */
const PICK_RADIUS = 10;

const ANIMALS = {
  Deer: ["#a8743a", 5],
  Rabbit: ["#e6e0d4", 3],
  Wolf: ["#6b6f7a", 5],
};
const DEPOSITS = {
  Wood: ["#2e5e34", 9],
  Stone: ["#96968c", 7],
  Flint: ["#3c404e", 5],
  Clay: ["#b26240", 7],
  Copper: ["#c47038", 6],
  Tin: ["#c4ccd4", 6],
  Iron: ["#783c32", 6],
  Berries: ["#a82858", 6],
  Mushrooms: ["#c4aa82", 5],
  Roots: ["#8c683a", 5],
  Grain: ["#d6b64a", 8],
};

const canvas = document.getElementById("world");
const ctx = canvas.getContext("2d");
const hud = document.getElementById("hud");
const statusEl = document.getElementById("status");
const panel = document.getElementById("panel");
const logPane = document.getElementById("log");
const worldLog = document.getElementById("world-log");

let catalog = null;
/** Every log entry received, oldest first. */
const eventLog = [];
let logDirty = true;
let worldSize = [1, 1];
let view = null;
let selected = null;
let layout = { scale: 1, x: 0, y: 0 };
/** The camera: the world point at the centre of the screen, and pixels per
 * world unit. Null until the first frame, which centres on the people. */
let camera = null;
const MAX_ZOOM = 8;
const KEY_PAN_SPEED = 600; // CSS pixels per second
const heldKeys = new Set();
let lastPan = 0;

// ---- Connection ----------------------------------------------------------

function connect() {
  const scheme = location.protocol === "https:" ? "wss" : "ws";
  const ws = new WebSocket(`${scheme}://${location.host}/ws`);
  setStatus(`Connecting to ${location.host}…`);
  ws.onmessage = (event) => {
    const msg = JSON.parse(event.data);
    if (msg.Welcome) {
      const w = msg.Welcome;
      if (w.protocol_version !== PROTOCOL_VERSION) {
        setStatus("The server was updated. Reload the page.");
        ws.close();
        ws.onclose = null;
        return;
      }
      catalog = w.catalog;
      worldSize = [w.world_width, w.world_height];
      setStatus(null);
    } else if (msg.Log) {
      eventLog.push(...msg.Log);
      if (eventLog.length > LOG_LIMIT) eventLog.splice(0, eventLog.length - LOG_LIMIT);
      logDirty = true;
      if (view) requestAnimationFrame(draw);
    } else if (msg.Frame && catalog) {
      view = msg.Frame;
      requestAnimationFrame(draw);
    }
  };
  ws.onclose = () => {
    setStatus("Disconnected. Reconnecting…");
    setTimeout(connect, 2000);
  };
}

function setStatus(text) {
  statusEl.textContent = text ?? "";
}

// ---- Helpers -------------------------------------------------------------

const material = (id) => catalog.materials.find((m) => m.id === id);
const species = (id) => catalog.species.find((s) => s.id === id);
const eraIndex = (id) => catalog.eras.findIndex((e) => e.id === id);
const eraName = (id) => catalog.eras[eraIndex(id)].name;
const plural = (n, word) => `${n} ${word}${n === 1 ? "" : "s"}`;
const pad = (n) => String(n).padStart(2, "0");

const minZoom = () => Math.min(innerWidth / worldSize[0], innerHeight / worldSize[1]);

function clampCamera() {
  const [ww, wh] = worldSize;
  camera.scale = Math.min(Math.max(camera.scale, minZoom()), MAX_ZOOM);
  camera.x = Math.min(Math.max(camera.x, 0), ww);
  camera.y = Math.min(Math.max(camera.y, 0), wh);
}

function zoomAt(factor, px, py) {
  const before = [(px - innerWidth / 2) / camera.scale + camera.x,
                  (py - innerHeight / 2) / camera.scale + camera.y];
  camera.scale *= factor;
  clampCamera();
  // Keep the world point under the pointer where it was.
  camera.x = before[0] - (px - innerWidth / 2) / camera.scale;
  camera.y = before[1] - (py - innerHeight / 2) / camera.scale;
  clampCamera();
}

function toScreen(x, y) {
  return [layout.x + x * layout.scale, layout.y + y * layout.scale];
}

function formatDuration(ticks) {
  const tpd = catalog.ticks_per_day;
  let days = Math.floor(ticks / tpd);
  const years = Math.floor(days / catalog.days_per_year);
  days %= catalog.days_per_year;
  const hours = Math.floor((ticks % tpd) / 60);
  if (years > 0) return `${plural(years, "year")}, ${plural(days, "day")}`;
  if (days > 0) return `${plural(days, "day")}, ${plural(hours, "hour")}`;
  return plural(hours, "hour");
}

/** Matches the HUD, which counts years and days from 1. */
function formatDate(tick) {
  const day = Math.floor(tick / catalog.ticks_per_day);
  const year = Math.floor(day / catalog.days_per_year);
  return `year ${year + 1}, day ${(day % catalog.days_per_year) + 1}`;
}

/** Total weight of an inventory, in kilograms. */
function carriedWeight(inventory) {
  return inventory.reduce((sum, [id, n]) => sum + material(id).weight * n, 0);
}

function formatInventory(inventory) {
  if (inventory.length === 0) return "Nothing";
  return inventory.map(([id, n]) => `${n} ${material(id).name}`).join(", ");
}

function hungerLabel(h) {
  if (h < 0.25) return "Full";
  if (h < 0.5) return "Peckish";
  if (h < 0.8) return "Hungry";
  return "Starving";
}

function groundColour(daylight) {
  const c = NIGHT_SKY.map((n, i) => Math.round(n + (DAY_GRASS[i] - n) * daylight));
  return `rgb(${c[0]},${c[1]},${c[2]})`;
}

// ---- Drawing -------------------------------------------------------------

function resize() {
  const dpr = window.devicePixelRatio || 1;
  canvas.width = Math.round(innerWidth * dpr);
  canvas.height = Math.round(innerHeight * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

function draw() {
  if (!view || !catalog) return;
  const w = innerWidth, h = innerHeight;
  const [ww, wh] = worldSize;
  if (!camera) {
    const px = view.people.reduce((s, p) => s + p.x, 0) / (view.people.length || 1);
    const py = view.people.reduce((s, p) => s + p.y, 0) / (view.people.length || 1);
    camera = { x: view.people.length ? px : ww / 2, y: view.people.length ? py : wh / 2, scale: 2 };
  }
  if (following && selected !== null) {
    const target = find(selected);
    if (target) { camera.x = target.item.x; camera.y = target.item.y; }
  }
  clampCamera();
  const scale = camera.scale;
  layout = { scale, x: w / 2 - camera.x * scale, y: h / 2 - camera.y * scale };

  ctx.fillStyle = "#0a0e23";
  ctx.fillRect(0, 0, w, h);
  ctx.fillStyle = groundColour(view.daylight);
  ctx.fillRect(layout.x, layout.y, ww * scale, wh * scale);

  for (const d of view.deposits) if (onScreen(d.x, d.y)) drawDeposit(d);

  const positions = new Map(view.people.map((p) => [p.id, toScreen(p.x, p.y)]));
  ctx.lineWidth = 1.5;
  const hovered = view.bonds.find((b) => b.a === hoveredBond?.a && b.b === hoveredBond?.b);
  if (hovered) {
    const a = positions.get(hovered.a), b = positions.get(hovered.b);
    if (a && b) {
      ctx.strokeStyle = `rgba(255,120,160,${Math.max(Math.min(hovered.affinity, 1), 0.3)})`;
      ctx.beginPath();
      ctx.moveTo(a[0], a[1]);
      ctx.lineTo(b[0], b[1]);
      ctx.stroke();
    }
  }

  for (const a of view.animals) {
    if (!onScreen(a.x, a.y)) continue;
    const [colour, size] = ANIMALS[a.species];
    const [x, y] = toScreen(a.x, a.y);
    ctx.fillStyle = colour;
    ctx.fillRect(x - size / 2, y - size / 2, size, size);
  }

  ctx.font = "11px system-ui, sans-serif";
  ctx.textBaseline = "bottom";
  for (const p of view.people) {
    const [x, y] = positions.get(p.id);
    ctx.fillStyle = PERSON;
    ctx.beginPath();
    ctx.arc(x, y, 4, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "rgba(255,255,255,.85)";
    ctx.fillText(p.name, x + 6, y - 6);
  }

  hud.textContent =
    `Year ${view.year + 1}, day ${view.day_of_year + 1} · ` +
    `${pad(Math.floor(view.minute_of_day / 60))}:${pad(view.minute_of_day % 60)} · ` +
    `${eraName(view.era)} · population ${view.people.length} · ` +
    `knowledge ${view.knowledge.toFixed(0)}`;

  const entity = selected === null ? null : find(selected);
  if (selected !== null && !entity) { selected = null; following = false; } // gone from the world
  if (entity) {
    const [x, y] = toScreen(entity.item.x, entity.item.y);
    ctx.strokeStyle = "#fff";
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(x, y, 8, 0, Math.PI * 2);
    ctx.stroke();
  }
  updatePanel(entity);
  updateLogs(entity);
}

function onScreen(wx, wy) {
  const [x, y] = toScreen(wx, wy);
  return x > -20 && y > -20 && x < innerWidth + 20 && y < innerHeight + 20;
}

/** Trees and foraged plants are round, everything dug from the ground is
 * square. Exhausted deposits fade out until (if ever) they grow back. */
function drawDeposit(d) {
  const info = material(d.material);
  const [colour, size] = DEPOSITS[d.material];
  const [x, y] = toScreen(d.x, d.y);
  ctx.globalAlpha = d.amount === 0 ? 0.3 : 1;
  ctx.fillStyle = colour;
  if (d.material === "Wood" || info.forage) {
    ctx.beginPath();
    ctx.arc(x, y, size / 2, 0, Math.PI * 2);
    ctx.fill();
  } else {
    ctx.fillRect(x - size / 2, y - size / 2, size, size);
  }
  ctx.globalAlpha = 1;
}

// ---- Selection -----------------------------------------------------------

function find(id) {
  const person = view.people.find((p) => p.id === id);
  if (person) return { kind: "person", item: person };
  const animal = view.animals.find((a) => a.id === id);
  if (animal) return { kind: "animal", item: animal };
  const deposit = view.deposits.find((d) => d.id === id);
  if (deposit) return { kind: "deposit", item: deposit };
  return null;
}

/** The person or animal closest to the pointer, if any is within range.
 * Otherwise the closest deposit, so a person standing by a tree stays easy
 * to click. */
function pick(px, py) {
  const nearest = (items) => {
    let best = null, bestDist = PICK_RADIUS;
    for (const item of items) {
      const [x, y] = toScreen(item.x, item.y);
      const dist = Math.hypot(x - px, y - py);
      if (dist <= bestDist) { best = item.id; bestDist = dist; }
    }
    return best;
  };
  return nearest([...view.people, ...view.animals]) ?? nearest(view.deposits);
}

let drag = null;
canvas.addEventListener("pointerdown", (e) => {
  if (!camera) return;
  drag = { x: e.clientX, y: e.clientY, moved: false };
  canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener("pointermove", (e) => {
  if (!drag) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  if (!drag.moved && Math.hypot(dx, dy) < 4) return;
  drag.moved = true;
  following = false;
  camera.x -= dx / camera.scale;
  camera.y -= dy / camera.scale;
  drag.x = e.clientX;
  drag.y = e.clientY;
  canvas.style.cursor = "grabbing";
  if (view) draw();
});
canvas.addEventListener("pointerup", () => { setTimeout(() => { drag = null; }); });
canvas.addEventListener("wheel", (e) => {
  if (!camera) return;
  e.preventDefault();
  zoomAt(Math.exp(-e.deltaY * 0.0015), e.clientX, e.clientY);
  if (view) draw();
}, { passive: false });

canvas.addEventListener("click", (e) => {
  if (!view || !catalog || (drag && drag.moved)) return;
  selected = pick(e.clientX, e.clientY);
  draw();
});
canvas.addEventListener("mousemove", (e) => {
  if (!view || !catalog || (drag && drag.moved)) return;
  canvas.style.cursor = pick(e.clientX, e.clientY) === null ? "default" : "pointer";
});
let following = false;
const PAN_KEYS = {
  w: [0, -1], arrowup: [0, -1], s: [0, 1], arrowdown: [0, 1],
  a: [-1, 0], arrowleft: [-1, 0], d: [1, 0], arrowright: [1, 0],
};
addEventListener("keydown", (e) => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const key = e.key.toLowerCase();
  if (key === "escape") { selected = null; following = false; if (view) draw(); }
  else if (key in PAN_KEYS) { e.preventDefault(); following = false; heldKeys.add(key); startPan(); }
  else if (!camera) return;
  else if (key === "+" || key === "=") { zoomAt(1.25, innerWidth / 2, innerHeight / 2); if (view) draw(); }
  else if (key === "-" || key === "_") { zoomAt(0.8, innerWidth / 2, innerHeight / 2); if (view) draw(); }
  else if (key === "0") { camera.scale = 0; camera.x = worldSize[0] / 2; camera.y = worldSize[1] / 2; following = false; if (view) draw(); }
  else if (key === "l") { logPane.hidden = !logPane.hidden; logDirty = true; if (view) draw(); }
  else if (key === "f") { following = selected !== null; }
});
addEventListener("keyup", (e) => { heldKeys.delete(e.key.toLowerCase()); });
addEventListener("blur", () => heldKeys.clear());

function startPan() {
  if (lastPan) return;
  lastPan = performance.now();
  requestAnimationFrame(panStep);
}

function panStep(now) {
  const dt = Math.min((now - lastPan) / 1000, 0.1);
  lastPan = now;
  let dx = 0, dy = 0;
  for (const k of heldKeys) if (k in PAN_KEYS) { dx += PAN_KEYS[k][0]; dy += PAN_KEYS[k][1]; }
  if (heldKeys.size === 0 || !camera) { lastPan = 0; return; }
  camera.x += dx * KEY_PAN_SPEED * dt / camera.scale;
  camera.y += dy * KEY_PAN_SPEED * dt / camera.scale;
  if (view) draw();
  requestAnimationFrame(panStep);
}
document.getElementById("close").addEventListener("click", () => {
  selected = null;
  if (view) draw();
});
addEventListener("resize", () => { resize(); if (view) draw(); });

// ---- Stats panel ---------------------------------------------------------

function el(tag, text) {
  const node = document.createElement(tag);
  if (text !== undefined) node.textContent = text;
  return node;
}

function bar(fraction, cls = "") {
  const outer = el("span");
  outer.className = `bar ${cls}`;
  const inner = el("i");
  inner.style.width = `${Math.min(Math.max(fraction, 0), 1) * 100}%`;
  outer.append(inner);
  return outer;
}

function row(table, label, value) {
  const tr = el("tr");
  const l = el("td", label);
  const v = el("td");
  if (value instanceof Node) v.append(value); else v.textContent = value;
  tr.append(l, v);
  table.append(tr);
}

let hoveredBond = null;

/** Newest first. `involving` limits it to entries about one entity. */
function logItems(involving) {
  const items = [];
  for (let i = eventLog.length - 1; i >= 0 && items.length < 100; i--) {
    const e = eventLog[i];
    if (involving !== undefined && !e.involved.includes(involving)) continue;
    const li = el("li", e.text);
    li.append(el("time", formatDate(e.tick)));
    items.push(li);
  }
  return items;
}

function updateLogs(entity) {
  const personId = entity?.kind === "person" ? entity.item.id : null;
  const key = `${eventLog.length}:${personId}:${logPane.hidden}`;
  if (key === updateLogs.key) return;
  updateLogs.key = key;
  if (!logPane.hidden) worldLog.replaceChildren(...logItems());
  const mine = document.getElementById("person-log");
  if (mine) mine.replaceChildren(...logItems(personId));
}

function updatePanel(entity) {
  if (!entity) { panel.hidden = true; hoveredBond = null; return; }
  const { kind, item } = entity;
  const table = el("table");
  let title;
  if (kind === "person") {
    title = item.name;
    const asleep = view.daylight < 0.25;
    const share = view.knowledge > 0 ? (item.knowledge / view.knowledge) * 100 : 0;
    row(table, "Age", formatDuration(Math.max(view.tick - item.born_tick, 0)));
    row(table, "Born", formatDate(item.born_tick));
    if (item.parents) {
      const names = item.parents.map((id) => view.people.find((p) => p.id === id)?.name ?? `#${id}`);
      row(table, "Parents", names.join(" and "));
    }
    row(table, "Status", asleep ? "Asleep" : "Awake");
    row(table, "Focus", item.focus.charAt(0).toUpperCase() + item.focus.slice(1));
    row(table, "Knowledge", `${item.knowledge.toFixed(1)} (${share.toFixed(0)}% of all)`);
    const hunger = el("span");
    hunger.append(bar(item.hunger), " ", hungerLabel(item.hunger));
    hunger.title = `Hunger ${item.hunger.toFixed(2)}`;
    row(table, "Hunger", hunger);
    row(table, "Has met", plural(item.acquaintances, "person").replace("persons", "people"));
    row(table, "Carrying", formatInventory(item.inventory));
    row(table, "Load", `${carriedWeight(item.inventory)} / ${catalog.carry_limit} kg`);
    row(table, "Position", `${item.x.toFixed(0)}, ${item.y.toFixed(0)}`);
  } else if (kind === "animal") {
    const info = species(item.species);
    title = `${info.name} #${item.id}`;
    row(table, "Species", info.name);
    row(table, "Speed", `${info.speed.toFixed(1)} per minute`);
    row(table, "Position", `${item.x.toFixed(0)}, ${item.y.toFixed(0)}`);
  } else {
    const info = material(item.material);
    title = `${info.deposit_name} #${item.id}`;
    row(table, "Material", info.name);
    row(table, "Left", `${item.amount} of ${info.capacity}`);
    row(table, "Regrows", info.regrowth_per_day === 0 ? "Never" : `${info.regrowth_per_day} per day`);
    row(table, "Gatherable",
      eraIndex(info.era) <= eraIndex(view.era) ? "Yes" : `From the ${eraName(info.era)}`);
    row(table, "Position", `${item.x.toFixed(0)}, ${item.y.toFixed(0)}`);
  }

  const children = [table];
  if (kind === "person") {
    const names = new Map(view.people.map((p) => [p.id, p.name]));
    const bonds = view.bonds
      .filter((b) => b.a === item.id || b.b === item.id)
      .map((b) => ({ name: names.get(b.a === item.id ? b.b : b.a) ?? "?", bond: b }))
      .sort((x, y) => y.bond.affinity - x.bond.affinity);
    if (bonds.length > 0) {
      const t = el("table");
      for (const { name, bond } of bonds) {
        const tr = el("tr");
        const met = el("td", `met ${bond.encounters}×`);
        met.title = `First met ${formatDate(bond.first_met)}`;
        const aff = el("td");
        aff.append(bar(bond.affinity, "bond"));
        aff.title = `Affinity ${bond.affinity.toFixed(2)}`;
        tr.append(el("td", name), aff, met);
        tr.dataset.a = bond.a;
        tr.dataset.b = bond.b;
        tr.addEventListener("mouseenter", () => { hoveredBond = { a: bond.a, b: bond.b }; });
        tr.addEventListener("mouseleave", () => { hoveredBond = null; });
        t.append(tr);
      }
      children.push(el("h4", "Relationships"), t);
    }
  }

  if (kind === "person") {
    const list = el("ul");
    list.className = "entries";
    list.id = "person-log";
    children.push(el("h4", "Events"), list);
  }

  document.getElementById("title").textContent = title;
  document.getElementById("stats").replaceChildren(...children);
  // Rows are rebuilt on every update, so re-derive the hover from the pointer.
  hoveredBond = null;
  for (const tr of document.querySelectorAll("#stats tr[data-a]")) {
    if (tr.matches(":hover")) hoveredBond = { a: Number(tr.dataset.a), b: Number(tr.dataset.b) };
  }
  panel.hidden = false;
  updateLogs.key = null; // the panel was rebuilt, so its log is empty again
}

resize();
connect();
</script>
