[package]
name = "server"
description = "Runs the world simulation, persists it to SQLite and serves the client."
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "world-server"
path = "src/main.rs"

[dependencies]
sim.workspace = true
protocol.workspace = true
serde_json.workspace = true
anyhow = "1"
axum = { version = "0.8", features = ["ws"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "migrate"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time", "net"] }
tokio-util = "0.7"
tower-http = { version = "0.6", features = ["fs", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"
