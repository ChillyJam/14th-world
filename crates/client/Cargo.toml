[package]
name = "client"
description = "Browser front end, compiled to WebAssembly. Renders the world on a 2D canvas."
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
sim.workspace = true
protocol.workspace = true
console_error_panic_hook = "0.1"
js-sys = "0.3"
wasm-bindgen = "0.2"

[dependencies.web-sys]
version = "0.3"
features = [
  "BinaryType",
  "CanvasRenderingContext2d",
  "CloseEvent",
  "Document",
  "Element",
  "HtmlCanvasElement",
  "Location",
  "MessageEvent",
  "WebSocket",
  "Window",
  "console",
]
