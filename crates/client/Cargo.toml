[package]
name = "client"
description = "Native desktop front end. Connects to a world server and renders the world live."
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "world-client"
path = "src/main.rs"

[dependencies]
sim.workspace = true
protocol.workspace = true
eframe = "0.36"
tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
# tungstenite's TLS support leaves the crypto backend to us. ring builds
# everywhere without extra tools (aws-lc-rs needs CMake and NASM on Windows).
rustls = { version = "0.23", default-features = false, features = ["ring"] }
